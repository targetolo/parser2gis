<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2GIS Parser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #00ff88;
    --accent2: #ff3c3c;
    --text: #e8e8e8;
    --muted: #555;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 64px;
    animation: fadeDown 0.7s ease both;
  }

  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(64px, 12vw, 110px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 16px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
    margin: 40px 0;
    animation: fadeIn 1s ease 0.3s both;
  }

  /* Form */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 40px;
    animation: fadeUp 0.7s ease 0.2s both;
  }

  .field {
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  label span {
    color: var(--accent);
    margin-right: 6px;
  }

  input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, input[type="url"]:focus {
    border-color: var(--accent);
  }

  input::placeholder { color: var(--muted); }

  .format-row {
    display: flex;
    gap: 10px;
  }

  .format-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .format-btn:hover { border-color: var(--accent); color: var(--accent); }

  .format-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,136,0.05);
  }

  .records-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .records-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  .records-val {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
  }

  /* Submit button */
  .btn-parse {
    width: 100%;
    background: var(--accent);
    color: #000;
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.08em;
    padding: 18px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn-parse:hover {
    background: #00ffaa;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(0,255,136,0.25);
  }

  .btn-parse:active { transform: translateY(0); }

  .btn-parse:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Status */
  .status-box {
    margin-top: 24px;
    padding: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .status-box.visible { display: block; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .dot.pulsing {
    animation: pulse 1s infinite;
  }

  .dot.error { background: var(--accent2); }
  .dot.success { background: var(--accent); animation: none; }

  .status-text { color: var(--text); }
  .status-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    padding-left: 20px;
  }

  /* Download button */
  .btn-download {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 14px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-download:hover {
    background: rgba(0,255,136,0.08);
  }

  /* Progress bar */
  .progress-bar {
    height: 2px;
    background: var(--border);
    margin-top: 16px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .progress-fill.indeterminate {
    animation: indeterminate 1.5s infinite ease-in-out;
  }

  /* Footer info */
  .info-row {
    display: flex;
    gap: 24px;
    margin-top: 40px;
    animation: fadeUp 0.7s ease 0.4s both;
  }

  .info-item {
    flex: 1;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .info-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .info-val {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  @keyframes indeterminate {
    0% { transform: translateX(-100%); width: 40%; }
    50% { width: 60%; }
    100% { transform: translateX(250%); width: 40%; }
  }

  @media (max-width: 520px) {
    .form-card { padding: 24px 20px; }
    .info-row { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="tag">▸ 2GIS Data Extractor</div>
    <h1>PARSE<br><span>2GIS</span></h1>
    <p class="subtitle">// вставь ссылку → получи данные в xlsx / csv / json</p>
  </header>

  <div class="divider"></div>

  <div class="form-card">

    <div class="field">
      <label><span>01</span> Ссылка на поиск 2GIS</label>
      <input type="url" id="urlInput" placeholder="https://2gis.ru/spb/search/кафе" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label><span>02</span> Формат файла</label>
      <div class="format-row">
        <button class="format-btn active" data-fmt="xlsx">XLSX</button>
        <button class="format-btn" data-fmt="csv">CSV</button>
        <button class="format-btn" data-fmt="json">JSON</button>
      </div>
    </div>

    <div class="field">
      <label><span>03</span> Максимум записей</label>
      <div class="records-row">
        <input type="range" id="maxRecords" min="100" max="5000" step="100" value="1000">
        <div class="records-val" id="recordsVal">1000</div>
      </div>
    </div>

    <button class="btn-parse" id="parseBtn" onclick="startParse()">
      НАЧАТЬ ПАРСИНГ
    </button>

    <div class="status-box" id="statusBox">
      <div class="status-line">
        <div class="dot pulsing" id="statusDot"></div>
        <span class="status-text" id="statusText">Инициализация...</span>
      </div>
      <div class="status-sub" id="statusSub"></div>
      <div class="progress-bar">
        <div class="progress-fill indeterminate" id="progressFill"></div>
      </div>
    </div>

  </div>

  <div class="info-row">
    <div class="info-item">
      <div class="info-label">Форматы</div>
      <div class="info-val">xlsx · csv · json</div>
    </div>
    <div class="info-item">
      <div class="info-label">Источник</div>
      <div class="info-val">2gis.ru</div>
    </div>
    <div class="info-item">
      <div class="info-label">Движок</div>
      <div class="info-val">parser-2gis v1.2</div>
    </div>
  </div>

</div>

<script>
  let selectedFormat = 'xlsx';
  let currentJobId = null;

  // Format buttons
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFormat = btn.dataset.fmt;
    });
  });

  // Range slider
  const slider = document.getElementById('maxRecords');
  const valDisplay = document.getElementById('recordsVal');
  slider.addEventListener('input', () => { valDisplay.textContent = slider.value; });

  function setStatus(text, sub, type) {
    const box = document.getElementById('statusBox');
    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const statusSub = document.getElementById('statusSub');
    const fill = document.getElementById('progressFill');

    box.classList.add('visible');
    statusText.textContent = text;
    statusSub.textContent = sub || '';

    dot.className = 'dot';
    fill.className = 'progress-fill';

    if (type === 'loading') {
      dot.classList.add('pulsing');
      fill.classList.add('indeterminate');
    } else if (type === 'error') {
      dot.classList.add('error');
      fill.style.width = '100%';
      fill.style.background = 'var(--accent2)';
    } else if (type === 'success') {
      dot.classList.add('success');
      fill.style.width = '100%';
    }
  }

  async function startParse() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      setStatus('Вставь ссылку с 2GIS', '', 'error');
      return;
    }
    if (!url.startsWith('https://2gis.ru')) {
      setStatus('Ссылка должна начинаться с https://2gis.ru', '', 'error');
      return;
    }

    // Remove old download button if any
    const oldBtn = document.getElementById('downloadBtn');
    if (oldBtn) oldBtn.remove();

    const btn = document.getElementById('parseBtn');
    btn.disabled = true;
    btn.textContent = 'ПАРСИНГ...';

    setStatus('Запуск браузера и парсинга...', 'Это может занять от 30 секунд до нескольких минут', 'loading');

    try {
      const res = await fetch('/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url,
          format: selectedFormat,
          max_records: parseInt(slider.value)
        })
      });

      const data = await res.json();

      if (!res.ok) {
        setStatus('Ошибка парсинга', data.detail || 'Неизвестная ошибка', 'error');
      } else {
        currentJobId = data.job_id;
        setStatus('Готово! Файл сформирован.', `Формат: ${data.format.toUpperCase()}`, 'success');

        const downloadBtn = document.createElement('a');
        downloadBtn.id = 'downloadBtn';
        downloadBtn.className = 'btn-download';
        downloadBtn.href = `/download/${data.job_id}/${data.format}`;
        downloadBtn.textContent = `↓ СКАЧАТЬ ${data.format.toUpperCase()}`;
        document.getElementById('statusBox').appendChild(downloadBtn);
      }
    } catch (e) {
      setStatus('Ошибка соединения с сервером', e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'НАЧАТЬ ПАРСИНГ';
    }
  }

  // Enter key
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startParse();
  });
</script>
</body>
</html>
